apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod-keycloak

resources:
  - ../../base
  - ingress.yaml

commonLabels:
  environment: production

images:
  - name: quay.io/keycloak/keycloak
    newTag: "26.3.3"

replicas:
  - name: keycloak
    count: 1

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: keycloak
